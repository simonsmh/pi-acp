name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Prepare pi-acp-dev package metadata
        run: |
          node -e "const fs = require('node:fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.name = 'pi-acp-dev'; p.repository = { type: 'git', url: 'git+https://github.com/simonsmh/pi-acp.git' }; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Publish pi-acp-dev to npm
        run: npm publish --access public
