name: Publish Dev Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional npm version for pi-acp-dev (for example 0.0.31-dev.1)'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: |
          npx prettier . --check
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Prepare dev package metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          if [ -n "$REQUESTED_VERSION" ]; then
            DEV_VERSION="$REQUESTED_VERSION"
          else
            DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi

          export DEV_VERSION
          node -e "const fs = require('node:fs'); const p = JSON.parse(fs.readFileSync('package.json', 'utf8')); p.name = 'pi-acp-dev'; p.version = process.env.DEV_VERSION; p.repository = { type: 'git', url: 'git+https://github.com/simonsmh/pi-acp.git' }; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n')"

          echo "Publishing pi-acp-dev@$DEV_VERSION"

      - name: Publish pi-acp-dev
        run: npm publish --tag dev --access public
